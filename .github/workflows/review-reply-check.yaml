name: Review Reply Check

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]

concurrency:
  group: review-reply-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  check-review-replies:
    if: >-
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check review thread replies
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prAuthor = context.payload.pull_request.user.login;
            const isMerged = context.eventName === 'pull_request' && context.payload.pull_request.merged;

            // GraphQL query to fetch all review threads with pagination
            const query = `
              query($owner: String!, $repo: String!, $prNumber: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 100, after: $cursor) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        isResolved
                        comments(first: 100) {
                          nodes {
                            author {
                              login
                            }
                            body
                            url
                            path
                            line
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            // Fetch all review threads with pagination
            let allThreads = [];
            let cursor = null;
            let hasNextPage = true;

            while (hasNextPage) {
              const result = await github.graphql(query, {
                owner,
                repo,
                prNumber,
                cursor,
              });

              const reviewThreads = result.repository.pullRequest.reviewThreads;
              allThreads = allThreads.concat(reviewThreads.nodes);
              hasNextPage = reviewThreads.pageInfo.hasNextPage;
              cursor = reviewThreads.pageInfo.endCursor;
            }

            // Filter resolved threads
            const resolvedThreads = allThreads.filter(t => t.isResolved);

            if (resolvedThreads.length === 0) {
              core.info('No resolved review threads found. Passing.');
              return;
            }

            // Check each resolved thread for PR author reply with keyword
            const REQUIRED_KEYWORDS = ['반영', '미반영'];
            const violations = [];

            for (const thread of resolvedThreads) {
              const comments = thread.comments.nodes;
              if (comments.length === 0) continue;

              const firstComment = comments[0];

              // Skip threads where the first comment author is deleted
              if (!firstComment.author) continue;

              const isBot = firstComment.author.login.endsWith('[bot]') ||
                firstComment.author.login === 'github-actions';
              const location = firstComment.path
                ? `${firstComment.path}${firstComment.line ? ':' + firstComment.line : ''}`
                : '(file-level comment)';
              const preview = firstComment.body.length > 80
                ? firstComment.body.substring(0, 80) + '...'
                : firstComment.body;

              const authorReplies = comments.slice(1).filter(
                c => c.author && c.author.login === prAuthor
              );

              if (authorReplies.length === 0) {
                violations.push({
                  location,
                  preview,
                  url: firstComment.url,
                  isBot,
                  reason: 'no_reply',
                });
              } else {
                const hasKeyword = authorReplies.some(
                  c => REQUIRED_KEYWORDS.some(kw => c.body.includes(kw))
                );
                if (!hasKeyword) {
                  violations.push({
                    location,
                    preview,
                    url: firstComment.url,
                    isBot,
                    reason: 'missing_keyword',
                  });
                }
              }
            }

            if (violations.length === 0) {
              core.info(`All ${resolvedThreads.length} resolved threads have author replies. Passing.`);
              return;
            }

            // Build violation details
            const violationLines = violations.map(v => {
              const botTag = v.isBot ? ' [bot]' : '';
              const reasonTag = v.reason === 'missing_keyword'
                ? ' ⚠️ reply는 있으나 "반영/미반영" 키워드 없음'
                : '';
              return `- ${v.location}${botTag} — "${v.preview}"${reasonTag}\n  ${v.url}`;
            });

            const noReplyCount = violations.filter(v => v.reason === 'no_reply').length;
            const missingKeywordCount = violations.filter(v => v.reason === 'missing_keyword').length;
            const statsParts = [];
            if (noReplyCount > 0) statsParts.push(`${noReplyCount}개 미응답`);
            if (missingKeywordCount > 0) statsParts.push(`${missingKeywordCount}개 키워드 누락`);
            const stats = `${statsParts.join(' + ')} / 총 ${resolvedThreads.length}개 resolved 스레드`;

            if (isMerged) {
              // Post-merge: PR comment notification
              const body = [
                `> [!WARNING]`,
                `> **Review Reply Check**`,
                `>`,
                `> @${prAuthor} 님, 머지된 PR에 반영여부 reply가 없거나 키워드가 누락된 리뷰 스레드가 있습니다.`,
                `> 다음 PR부터는 resolve 전에 "반영" 또는 "미반영" 키워드를 포함한 코멘트를 남겨주세요.`,
                ``,
                ...violationLines,
                ``,
                stats,
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });

              core.warning(`Post-merge: ${stats}`);
            } else {
              // Pre-merge: block with setFailed
              const message = [
                `⚠️ Review Reply Check Failed`,
                ``,
                `@${prAuthor} 님, 다음 리뷰 스레드에 반영여부 reply가 없거나 키워드가 누락되었습니다.`,
                `Resolve 전에 "반영" 또는 "미반영" 키워드를 포함한 코멘트를 남겨주세요.`,
                ``,
                ...violationLines,
                ``,
                stats,
              ].join('\n');

              core.summary.addRaw(message);
              await core.summary.write();
              core.setFailed(message);
            }
